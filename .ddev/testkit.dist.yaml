# What the testkit offers. Copy any key you want to change into testkit.yaml, which is not
# versioned. Maps are merged key by key, lists are replaced. A change needs `ddev restart`, which
# empties the slots.

# How many runs may happen at the same time.
slots: 5

php:
    versions: ["8.3", "8.4", "8.5"]
    default: "8.4"

databases:
    servers:
        mysql: "8.4"
        mariadb: "10.7"
    default: mysql

# A composer repository besides packagist, for closed-source packages.
registry: ~

# Packages taken from a checkout instead of from a registry, as package name: host path.
composer_symlinks: {}

# Services from the catalogue in .ddev/testkit/services, for example [redis, opensearch].
services: []

# The memory limit of the web container. All slots share it.
memory: 8g
