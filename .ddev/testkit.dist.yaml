# What this testkit offers. Copy any key you want to change into testkit.yaml, which is not
# versioned; what is not named there is taken from here.
#
# Changing anything below needs one `ddev restart`, which empties the slots: the ports, the fpm
# pools and the database services are written from this file when the containers come up.

# Where your checkouts live, so a package can be named without its path. Name yours in
# testkit.yaml. Without one, a package is named by its path.
roots: []

# A composer repository besides packagist. Name yours in testkit.yaml.
#registry:

# Packages that come from your working copy instead of from the registry. The package you test
# always does, and needs no entry here.
#paths:
#    open-dxp/test-foundation: /absolute/path/to/the/checkout

# How many runs may happen at the same time. Each one gets its own directory, database and port.
slots: 5

php:
    versions: ["8.3", "8.4", "8.5"]
    default: "8.4"

databases:
    # mysql is the server ddev brings. Every other name here becomes a service of its own.
    mysql: "8.4"
    mariadb: "10.7"
    default: mysql

# Containers a suite needs beside the application. The name is the host name inside the network.
services:
    redis: redis:7-alpine

# Handed to the web container, where the tests read it.
environment:
    OPENDXP_TEST_REDIS_DSN: "redis://redis:6379"
