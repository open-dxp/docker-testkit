name: opendxp-docker-testkit
type: php
docroot: public/public
php_version: "8.3"
webserver_type: apache-fpm
router_http_port: "80"
router_https_port: "443"
composer_version: "2"
webimage: docker.dachcom.net/docker/ddev-base:latest
additional_fqdns:
    - 'opendxp-testing.test'
additional_hostnames:
    - 'test-domain1.test'
    - 'test-domain2.test'
    - 'test-domain3.test'
    - 'test-domain4.test'
    - 'test-domain5.test'
    - 'test-domain6.test'
    - 'test-domain7.test'
database:
    type: mysql
    version: '8.0'
hooks:
    post-start:
        -   exec: "echo 'Linking .env File'"
        -   exec: "sh -c 'cd $DDEV_DOCROOT && touch .env'"
        -   exec: "echo 'Booting Test System'"
        -   exec: "/bin/bash /usr/local/bin/boot-system.sh"

web_environment:
    - OPENDXP_PHP_ERROR_REPORTING=32767
    - TEST_OPENDXP_VERSION=${TEST_OPENDXP_VERSION:-^1.0}
    - TEST_SYMFONY_VERSION=${TEST_SYMFONY_VERSION:-^7.3}
    - TEST_EXECUTE_COMPOSER=${TEST_EXECUTE_COMPOSER:-false}
    - TEST_BUNDLE_NAME=${TEST_BUNDLE_NAME:-FormBuilderBundle}
    - TEST_BUNDLE_VENDOR_NAME=${TEST_BUNDLE_VENDOR_NAME:-open-dxp/formbuilder-bundle}
    - TEST_BUNDLE_INSTALLER_CLASS=${TEST_BUNDLE_INSTALLER_CLASS:-false}
    - TEST_BUNDLE_TEST_DIR=/var/www/html/public/lib/test-bundle/tests
    - TEST_PROJECT_ROOT_DIR=/var/www/html/public

    - OPENDXP_CODECEPTION_FRAMEWORK=/var/www/html/public/lib/opendxp-codeception-framework
    - OPENDXP_CODECEPTION_VERSION=1.x

    - WEBDRIVER_DOWNLOAD_PATH=/home/seluser/Downloads

    - OPENDXP_CLASS_DIRECTORY=/var/www/html/public/lib/test-bundle/tests/_output/var/classes
    - APP_ENV=test
    - OPENDXP_TEST_DB_DSN=mysql://db:db@db:3306/db
    - OPENDXP_PHP_ERROR_REPORTING=32767
    - OPENDXP_INSTALL_MYSQL_DATABASE=db
    - OPENDXP_INSTALL_MYSQL_USERNAME=db
    - OPENDXP_INSTALL_MYSQL_PASSWORD=db
    - OPENDXP_INSTALL_ADMIN_USERNAME=db
    - OPENDXP_INSTALL_ADMIN_PASSWORD=db
    - OPENDXP_INSTALL_MYSQL_HOST_SOCKET=db
    - DOCUMENT_ROOT=/var/www/html/public/
