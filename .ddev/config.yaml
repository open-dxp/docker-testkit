name: opendxp-docker-testkit
type: php
docroot: app/public
php_version: "8.4"
webserver_type: apache-fpm
router_http_port: "80"
router_https_port: "443"
composer_version: "2"
fail_on_hook_fail: true
additional_fqdns: []
additional_hostnames: []

# The database servers are services generated from testkit.yaml, so ddev's own one is not needed.
omit_containers: [db]

hooks:
    pre-start:
        -   exec-host: "mkdir -p app/public && touch app/public/index.php"
        -   exec-host: ".ddev/testkit/generate"

    post-start:
        -   exec: "test -d /var/www/html/mcp-server/node_modules || npm --prefix /var/www/html/mcp-server install --omit=dev --no-audit --no-fund"

    pre-stop:
        -   exec: "php /var/www/html/.ddev/testkit/testkit.php release --all --fail-if-busy"

web_environment:

    # bin/console does not read APP_ENV from the .env of a slot before it boots the kernel.
    - APP_ENV=test
